[package]
name = "rust-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "trtllm-client"
path = "src/main.rs"

[dependencies]
# HTTP client — async, JSON feature for easy request/response bodies
reqwest = { version = "0.12", features = ["json"] }

# Serialization — serde_json for OpenAI-compatible JSON payloads
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64 encoding — for inline image payloads (Caption capability)
base64 = "0.22"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Structured per-request logging (FR-009)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Request ID generation
uuid = { version = "1", features = ["v4"] }

# async fn in traits (stable ergonomics for LlmClient trait)
async-trait = "0.1"
